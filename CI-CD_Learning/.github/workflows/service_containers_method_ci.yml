name: Account Manager CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Define service containers needed for the job
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: account_manager_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Simple health check to wait until postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Create .env file for testing
      run: |
        echo "SECRET_KEY=testing_secret_key" >> .env
        # Point the app to the service container
        echo "DATABASE_URL=postgresql://user:password@localhost:5432/account_manager_test" >> .env 
        echo "FLASK_ENV=testing" >> .env

    - name: Run Tests
      run: |
        pytest