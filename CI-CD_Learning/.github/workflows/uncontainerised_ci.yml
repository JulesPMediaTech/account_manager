name: Account Manager CI

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest # Ensure pytest is installed

    # 4. Create a dummy .env file for testing
    # Since your app loads config from .env, we provide safe defaults here
    - name: Create .env file
      run: |
        echo "SECRET_KEY=testing_secret_key" >> .env
        echo "DB_PASSWORD=testing_db_password" >> .env
        echo "FLASK_ENV=testing" >> .env

    # 5. Run Tests
    - name: Test with pytest
      run: |
        pytest