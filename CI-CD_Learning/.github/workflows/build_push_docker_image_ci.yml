name: Build and Push Docker Image

on:
  push:
    # Only run this when code is pushed to the main branch
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This step logs the 'Robot' into Docker Hub using your GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: #  Github gets these variables from respository secrets
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # This builds the image and pushes it to the registry
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'your-username' with your actual Docker Hub name or use the secret
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
